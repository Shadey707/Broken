<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="ssn">Enter your social security number</label>
        <input type="text" id="ssn" placeholder="111-11-1111" name="ssn" required maxlength="9" minlength="9">
        
        <label>search</label>
        <input type="search" name="search" required>

        <label>password</label>
        <input type="password" name="password" required pattern="">

        <label>User</label>
        <input type="email">

        <label>button</label>
        <input type="button">

        <label>color</label>
        <input type="color">

        <label>checkbox</label>
        <input type="checkbox">

        <label>file</label>
        <input type="file">

        <input type="submit">

    </form>
    
</body>
</html>
